<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Painel de Tarefas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="cartao">
        <header>
            <h1>Minhas Tarefas <i class="fa-solid fa-star"></i></h1>
            <button id="botao-tema"><i class="fa-solid fa-moon"></i></button>
        </header>

        <div class="container-foto">
            <img src="94b5306c-4cf9-4ab0-995b-0b148e70e644_Original (1).JPG" alt="Minha Foto" id="foto-perfil" class="foto-perfil">
        </div>

        <div class="caixa-entrada">
            <input type="text" id="campo-tarefa" placeholder="O que vamos fazer hoje?..." maxlength="40">
            <button id="botao-adicionar"><i class="fa-solid fa-plus"></i> Adicionar</button>
        </div>

        <div class="filtros">
            <button id="filtro-todas" class="ativo">Todas</button>
            <button id="filtro-pendentes">Pendentes</button>
            <button id="filtro-realizadas">Realizadas</button>
        </div>

        <ul id="lista-tarefas"></ul>

        <footer>
            <span id="contador">0 tarefas</span>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
